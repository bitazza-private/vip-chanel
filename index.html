<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitazza Elite — Exclusive Access</title>
<style>
  /* ดึงฟอนต์หรูหราแบบเดียวกับ V2 มาใช้ */
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; }
  body, html { 
    margin: 0; 
    padding: 0; 
    background-color: #f4f3ed; /* พื้นหลังสีทราย */
    font-family: 'Jost', Helvetica, Arial, sans-serif; 
    color: #5c574f; 
    -webkit-font-smoothing: antialiased; 
  }
  .serif { font-family: 'Cormorant Garamond', Georgia, serif; }

  /* กล่องฟอร์มตรงกลาง */
  .wrap { 
    max-width: 540px; 
    margin: 60px auto; 
    padding: 50px 40px; 
    background: #fdfcf9; /* สีขาวออฟไวท์ */
    border: 1px solid #ebe6da; 
    border-radius: 8px; 
    box-shadow: 0 20px 50px rgba(26,24,20,0.06); 
  }

  .logo { text-align: center; margin-bottom: 35px; }
  /* โลโก้แบบดึงพื้นขาวทิ้ง กลมกลืนไปกับพื้นหลัง */
  .logo img { height: 50px; mix-blend-mode: multiply; }

  .header { text-align: center; margin-bottom: 40px; }
  .header h1 { font-size: 38px; font-weight: 600; color: #b8923c; margin: 0 0 15px 0; }
  .header p { font-size: 15px; line-height: 1.8; color: #6a645b; margin: 0; }

  /* สไตล์กล่องกรอกข้อมูล */
  .form-group { margin-bottom: 25px; }
  .form-group label { 
    display: block; 
    font-size: 11px; 
    letter-spacing: 2px; 
    text-transform: uppercase; 
    color: #b8923c; 
    font-weight: 600; 
    margin-bottom: 8px; 
  }
  .form-group input { 
    width: 100%; 
    padding: 16px 20px; 
    font-family: 'Jost', sans-serif; 
    font-size: 14px; 
    color: #1a1814; 
    background: #ffffff; 
    border: 1px solid #d1c8b4; 
    border-radius: 2px; 
    transition: border-color 0.3s ease; 
  }
  .form-group input:focus { border-color: #b8923c; outline: none; }
  .form-group input::placeholder { color: #a8a396; }

  /* เส้นคั่นกลางแบบหรูหรา */
  .divider { 
    display: flex; 
    align-items: center; 
    text-align: center; 
    margin: 40px 0 25px 0; 
  }
  .divider::before, .divider::after { 
    content: ''; 
    flex: 1; 
    border-bottom: 1px solid #d1c8b4; 
  }
  .divider span { 
    padding: 0 20px; 
    font-family: 'Cormorant Garamond', serif; 
    font-size: 22px; 
    font-weight: 600; 
    color: #1a1814; 
  }

  /* ปุ่มเลือกช่องทางติดต่อ (ดีไซน์ใหม่) */
  .radio-group { 
    display: flex; 
    gap: 12px; 
    flex-wrap: wrap; 
  }
  .radio-label { 
    flex: 1; 
    min-width: 110px; 
    text-align: center; 
  }
  .radio-label input { display: none; }
  .radio-label span { 
    display: block; 
    padding: 14px 10px; 
    border: 1px solid #d1c8b4; 
    border-radius: 2px; 
    font-size: 13px; 
    font-weight: 500;
    color: #6a645b; 
    cursor: pointer; 
    transition: all 0.3s ease; 
    background: #ffffff; 
  }
  /* พอกดเลือกแล้วจะกลายเป็นสีทอง */
  .radio-label input:checked + span { 
    background: #b8923c; 
    color: #ffffff; 
    border-color: #b8923c; 
  }
  .radio-label span:hover { border-color: #b8923c; }

  /* ปุ่มกด Submit */
  .btn { 
    display: block; 
    width: 100%; 
    background: #1a1814; 
    color: #ffffff !important; 
    font-size: 12px; 
    letter-spacing: 2.5px; 
    text-transform: uppercase; 
    font-weight: 600; 
    padding: 20px 0; 
    border: none; 
    border-radius: 2px; 
    cursor: pointer; 
    transition: all 0.4s ease; 
    text-align: center; 
    text-decoration: none; 
    margin-top: 40px;
  }
  .btn:hover { 
    background: #b8923c; 
    transform: translateY(-2px); 
    box-shadow: 0 10px 20px rgba(184, 146, 60, 0.25); 
  }

  .back-link { 
    display: block; 
    text-align: center; 
    margin-top: 30px; 
    font-size: 11px; 
    letter-spacing: 1px; 
    color: #8a8377; 
    text-transform: uppercase; 
    text-decoration: none; 
    transition: color 0.3s; 
  }
  .back-link:hover { color: #b8923c; }

  /* สำหรับมือถือ */
  @media (max-width: 600px) {
    .wrap { margin: 20px; padding: 40px 24px; }
    .header h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo">
    <img src="https://raw.githubusercontent.com/bitazza-private/vip-chanel/main/logo.jpg" alt="Bitazza Elite">
  </div>

  <div class="header">
    <h1 class="serif">Exclusive Access</h1>
    <p>Please provide your details below to initiate your private request.<br>Our executive team will contact you shortly.</p>
  </div>

  <form action="#" method="POST">
    
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" placeholder="+66 8X XXX XXXX" required>
    </div>

    <div class="divider">
      <span>Preferred Contact Channel</span>
    </div>

    <!-- เปลี่ยนเป็นปุ่มกดเลือกช่องทางที่ดูพรีเมียมขึ้น -->
    <div class="radio-group">
      <label class="radio-label">
        <input type="radio" name="channel" value="Line" checked>
        <span>LINE</span>
      </label>
      <label class="radio-label">
        <input type="radio" name="channel" value="WhatsApp">
        <span>WhatsApp</span>
      </label>
      <label class="radio-label">
        <input type="radio" name="channel" value="Telegram">
        <span>Telegram</span>
      </label>
      <label class="radio-label">
        <input type="radio" name="channel" value="Direct Call">
        <span>Direct Call</span>
      </label>
    </div>

    <button type="submit" class="btn">Submit Request</button>
  </form>

  <a href="https://bitazza-private.github.io/vip-chanel/v2.html" class="back-link">← Return to Main Page</a>

</div>

</body>
</html>
