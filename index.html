<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exclusive VIP Request</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0d0d0d;
      color: #e6e6e6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #141414;
      border: 1px solid #d4af37;
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
    }
    h2 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 8px;
      font-size: 24px;
      letter-spacing: 1px;
    }
    p.subtitle {
      text-align: center;
      color: #a0a0a0;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #c5a059;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: #d4af37;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.3s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>EXCLUSIVE ACCESS</h2>
    <p class="subtitle">Private Client Registration</p>

    <form id="goldForm">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="entry.1855821471" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" name="entry.1951851605" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label>Phone Number *</label>
        <input type="tel" name="entry.1554064553" placeholder="+66 8X XXX XXXX" required>
      </div>

      <div class="form-group">
        <label>Line ID</label>
        <input type="text" name="entry.565526970" placeholder="Your Line ID">
      </div>

      <div class="form-group">
        <label>Telegram</label>
        <input type="text" name="entry.390137682" placeholder="@username">
      </div>

      <div class="form-group">
        <label>WhatsApp</label>
        <input type="text" name="entry.786941682" placeholder="+66 8X XXX XXXX">
      </div>

      <button type="submit" id="submitBtn">Submit Private Request</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('goldForm');
    
    // URL ท่อยิงข้อมูลที่ถูกต้อง
    const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSdkH60UvWyGf6oIuiRbqQm-2TklefgJbjv3cxLkYuMIyFiXxQ/formResponse';

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.innerText = "Processing...";
      btn.disabled = true;

      const formData = new FormData(form);

      fetch(GOOGLE_FORM_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
      }).then(() => {
        alert("Your private request has been submitted successfully.");
        form.reset();
        btn.innerText = "Submit Private Request";
        btn.disabled = false;
      }).catch(error => {
        alert("Error submitting request. Please try again.");
        btn.innerText = "Submit Private Request";
        btn.disabled = false;
      });
    });
  </script>

</body>
</html>
