<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exclusive Access</title>
  <!-- นำเข้าฟอนต์หรูหราจาก Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505; /* พื้นหลังดำสนิทแบบพรีเมียม */
      color: #e6e6e6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      font-family: 'Inter', sans-serif;
    }
    .container {
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 40px 30px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }
    h2 {
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin-bottom: 15px;
      /* โค้ดทำตัวอักษรไล่เฉดสีทอง */
      background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }
    p.subtitle {
      text-align: center;
      color: #888;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 30px;
      font-weight: 300;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #d4af37;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }
    input::placeholder {
      color: #444;
    }
    input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
      background: #1a1a1a;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 35px 0 25px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #333;
    }
    .divider span {
      padding: 0 15px;
      color: #e6cca3;
      font-size: 15px;
      font-family: 'Playfair Display', serif;
    }
    button {
      width: 100%;
      padding: 16px;
      /* ปุ่มไล่เฉดสีทองแบบมีมิติ */
      background: linear-gradient(90deg, #b38728 0%, #fbf5b7 50%, #b38728 100%);
      border: none;
      border-radius: 6px;
      color: #000;
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.3s ease;
    }
    button:hover {
      background: linear-gradient(90deg, #d4af37 0%, #fffbd4 50%, #d4af37 100%);
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
    }
    button:disabled {
      background: #333;
      color: #777;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Exclusive Access</h2>
    <p class="subtitle">
      Please provide your details below to initiate your private request.<br><br>
      Our executive team will contact you shortly.
    </p>

    <form id="goldForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="entry.1855821471" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="entry.1951851605" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="entry.1554064553" placeholder="+66 8X XXX XXXX" required>
      </div>

      <div class="divider">
        <span>Preferred Contact Channel</span>
      </div>

      <div class="form-group">
        <label>Line ID (Optional)</label>
        <input type="text" name="entry.565526970" placeholder="Your Line ID">
      </div>

      <div class="form-group">
        <label>Telegram (Optional)</label>
        <input type="text" name="entry.390137682" placeholder="@username">
      </div>

      <div class="form-group">
        <label>WhatsApp (Optional)</label>
        <input type="text" name="entry.786941682" placeholder="WhatsApp Number">
      </div>

      <button type="submit" id="submitBtn">Submit Private Request</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('goldForm');
    const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSdkH60UvWyGf6oIuiRbqQm-2TklefgJbjv3cxLkYuMIyFiXxQ/formResponse';

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.innerText = "PROCESSING...";
      btn.disabled = true;

      const formData = new FormData(form);

      fetch(GOOGLE_FORM_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
      }).then(() => {
        alert("Your private request has been submitted successfully.");
        form.reset();
        btn.innerText = "SUBMIT PRIVATE REQUEST";
        btn.disabled = false;
      }).catch(error => {
        alert("Error submitting request. Please try again.");
        btn.innerText = "SUBMIT PRIVATE REQUEST";
        btn.disabled = false;
      });
    });
  </script>

</body>
</html>
